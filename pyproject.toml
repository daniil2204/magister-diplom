[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsa"
version = "0.1.0"
description = "Hybrid static analysis and symbolic execution for Solidity vulnerability detection"
requires-python = ">=3.10"
dependencies = [
    "slither-analyzer==0.11.6",
    "z3-solver==5.3.3.0",
    "solc-select==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
hsa = "hsa.cli:main"

[tool.setuptools.packages.find]
include = ["hsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
